name: Build Laksanasoft Kernel (Final Stable)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 🧹 Clean Workspace & Prepare Disk Space
        uses: actions/checkout@v4

      - name: 📦 Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libncurses5-dev \
            libncurses-dev libelf-dev zip unzip curl git ccache \
            lzop libssl-dev python3 python2 crossbuild-essential-arm64

      - name: 📥 Clone Toolchain (AOSP Clang & GCC Cross-Compilers)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

      - name: 📥 Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/Laksanasoft-Kernel/Laksanasoft-Kernel.git -b main kernel

      - name: ⚙️ Configure Safe Built-In Drivers & Fix Broken Subsystems
        run: |
          cd kernel
          mkdir -p out
          export CLANG_PATH="$(pwd)/../clang/bin"
          
          # Terapkan Defconfig Resmi Samsung Exynos 9820 (beyond2lte / S10+)
          make O=out ARCH=arm64 CC=$CLANG_PATH/clang exynos9820-beyond2lte_defconfig

          # Disable Subsistem Cacat/Penyebab Syntax Error
          ./scripts/config --file out/.config -d CONFIG_SQUASHFS

          # Enable Driver Jaringan USB & Tethering (Built-In)
          ./scripts/config --file out/.config -e CONFIG_USB_NET_DRIVERS
          ./scripts/config --file out/.config -e CONFIG_USB_RTL8152
          ./scripts/config --file out/.config -e CONFIG_USB_USBNET
          ./scripts/config --file out/.config -e CONFIG_USB_NET_CDCETHER
          ./scripts/config --file out/.config -e CONFIG_USB_NET_CDC_NCM
          ./scripts/config --file out/.config -e CONFIG_USB_NET_RNDIS_HOST

          # Enable Driver CAN-Bus (Built-In)
          ./scripts/config --file out/.config -e CONFIG_CAN
          ./scripts/config --file out/.config -e CONFIG_CAN_RAW
          ./scripts/config --file out/.config -e CONFIG_CAN_BCM
          ./scripts/config --file out/.config -e CONFIG_CAN_GW
          ./scripts/config --file out/.config -e CONFIG_CAN_VCAN
          ./scripts/config --file out/.config -e CONFIG_CAN_SLCAN
          ./scripts/config --file out/.config -e CONFIG_CAN_DEV
          ./scripts/config --file out/.config -e CONFIG_CAN_CALC_BITTIMING
          ./scripts/config --file out/.config -e CONFIG_CAN_USB

          # Enable Security & VPN Features
          ./scripts/config --file out/.config -e CONFIG_WIREGUARD
          ./scripts/config --file out/.config -e CONFIG_NETFILTER
          ./scripts/config --file out/.config -e CONFIG_IP_NF_IPTABLES

          # Disable Modul Out-Of-Tree Eksternal Penyebab Conflict Linker (RTL88xx)
          ./scripts/config --file out/.config -d CONFIG_RTL8812AU
          ./scripts/config --file out/.config -d CONFIG_RTL88XXAU

          # Sinkronisasi ulang dependensi
          make O=out ARCH=arm64 CC=$CLANG_PATH/clang \
            CROSS_COMPILE="$(pwd)/../gcc64/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="$(pwd)/../gcc32/bin/arm-linux-androideabi-" olddefconfig

      - name: 🔨 Compile Kernel Image
        run: |
          cd kernel
          export CLANG_PATH="$(pwd)/../clang/bin"
          export GCC64_PATH="$(pwd)/../gcc64/bin"
          export GCC32_PATH="$(pwd)/../gcc32/bin"
          
          # Eksekusi kompilasi dengan penanganan kesalahan otomatis (-j1 pada pembongkaran error)
          make -j$(nproc --all) O=out ARCH=arm64 CC=$CLANG_PATH/clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$GCC64_PATH/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=$GCC32_PATH/arm-linux-androideabi- || \
          make -j1 V=1 O=out ARCH=arm64 CC=$CLANG_PATH/clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$GCC64_PATH/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=$GCC32_PATH/arm-linux-androideabi-

      - name: 📦 Package Output Artifacts
        run: |
          cd kernel/out/arch/arm64/boot
          mkdir -p ../../../../../build_output
          if [ -f Image.gz-dtb ]; then
            cp Image.gz-dtb ../../../../../build_output/
          elif [ -f Image.gz ]; then
            cp Image.gz ../../../../../build_output/
          elif [ -f Image ]; then
            cp Image ../../../../../build_output/
          fi

      - name: 📤 Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Laksanasoft-Kernel-Exynos9820
          path: build_output/*
