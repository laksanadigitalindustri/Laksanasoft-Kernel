name: Build NetHunter Laksanasoft Enterprise Kernel (APatch Pre-Rooted)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile & Pre-Root NetHunter Kernel (48MB Raw)
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git gnupg gperf liblz4-tool libncurses5-dev libssl-dev lzop rsync zip python3 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: 📥 Clone Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: 📥 Clone Official NetHunter Source (v0lk3n nethunter-lineage-23.2)
        run: |
          git clone --recurse-submodules https://github.com/v0lk3n/nethunter_kernel_samsung_exynos9820.git -b nethunter-lineage-23.2 kernel

      - name: ⚙️ Configure & Tune Defconfig (Built-in Drivers & NetHunter)
        run: |
          cd kernel
          export ARCH=arm64
          export CLANG_PATH="$(pwd)/../clang/bin"
          
          DEFCONFIG="exynos9820-beyond2lte_defconfig"
          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            DEFCONFIG=$(ls arch/arm64/configs/ | grep beyond2lte | head -n 1)
          fi
          
          make O=out ARCH=arm64 CC=$CLANG_PATH/clang CROSS_COMPILE=$CLANG_PATH/aarch64-linux-gnu- CROSS_COMPILE_ARM32=$CLANG_PATH/arm-linux-gnueabi- $DEFCONFIG
          
          # Built-in Vendor Drivers (prevent vermagic mismatch bootloop)
          ./scripts/config --file out/.config -e MALI_B_KBASE -e BCMDHD
          
          # NetHunter Wireless, HID BadUSB, Bluetooth & Docker Engine
          ./scripts/config --file out/.config \
            -e NAMESPACES -e UTS_NS -e IPC_NS -e USER_NS -e PID_NS -e NET_NS \
            -e CGROUPS -e CGROUP_CPUACCT -e CGROUP_DEVICE -e CGROUP_FREEZER -e CGROUP_SCHED -e CPUSETS -e MEMCG \
            -e OVERLAY_FS -e NETFILTER_XT_MARK -e IP_NF_FILTER -e IP_NF_TARGET_MASQUERADE \
            -e USB_CONFIGFS_F_HID -e USB_G_HID \
            -e ATH9K_HTC -e RTL8187 -e RTL8812AU -e RTL88XXAU -e RTL88X2BU -e CFG80211 \
            -e BT_RFCOMM -e BT_HCIBTUSB \
            --set-str LOCALVERSION "-Laksanasoft-NetHunter-Enterprise-v1.0"
          
          make O=out ARCH=arm64 CC=$CLANG_PATH/clang CROSS_COMPILE=$CLANG_PATH/aarch64-linux-gnu- CROSS_COMPILE_ARM32=$CLANG_PATH/arm-linux-gnueabi- olddefconfig

      - name: 🔨 Compile NetHunter Kernel & DTB (Uncompressed Raw ARM64 48MB)
        run: |
          cd kernel
          export CLANG_PATH="$(pwd)/../clang/bin"
          make -j$(nproc --all) O=out ARCH=arm64 CC=$CLANG_PATH/clang CROSS_COMPILE=$CLANG_PATH/aarch64-linux-gnu- CROSS_COMPILE_ARM32=$CLANG_PATH/arm-linux-gnueabi- KCFLAGS="-Wno-error" Image dtbs
          
          if [ -d "out/arch/arm64/boot/dts/exynos" ]; then
            cat out/arch/arm64/boot/dts/exynos/*.dtb > out/arch/arm64/boot/dtb || true
          fi
          if [ -f "out/arch/arm64/boot/Image" ] && [ -f "out/arch/arm64/boot/dtb" ]; then
            cat out/arch/arm64/boot/Image out/arch/arm64/boot/dtb > out/arch/arm64/boot/Image-dtb
          fi

      - name: 🔑 Pre-Inject APatch Root Module (SuperKey Setup)
        run: |
          curl -sL https://github.com/bmax121/APatch/releases/download/v10.7/APatch_v10.7_11071_release-signed.apk -o apatch.apk || true
          unzip -q apatch.apk "assets/kptools-x86_64" "assets/kpimg" -d . || unzip -q apatch.apk "assets/kptools*" "assets/kpimg*" -d . || true
          
          KPTOOLS=$(find assets/ -name "kptools*" | head -n 1)
          KPIMG=$(find assets/ -name "kpimg*" | head -n 1)
          chmod +x $KPTOOLS || true
          
          if [ -f "$KPTOOLS" ] && [ -f "$KPIMG" ] && [ -f "kernel/out/arch/arm64/boot/Image-dtb" ]; then
            echo "[+] Injecting APatch Root into NetHunter Kernel..."
            $KPTOOLS -p -i kernel/out/arch/arm64/boot/Image-dtb -S "160170@.Jkl" -k $KPIMG -o kernel/out/arch/arm64/boot/Image-patched || true
            if [ -f "kernel/out/arch/arm64/boot/Image-patched" ]; then
              mv kernel/out/arch/arm64/boot/Image-patched kernel/out/arch/arm64/boot/Image-dtb
              echo "[+] APatch Root Injected Successfully!"
            fi
          fi

      - name: 📦 Package NetHunter Laksanasoft Enterprise Kernel (APatch Rooted)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          if [ -f "kernel/out/arch/arm64/boot/Image-dtb" ]; then
            cp kernel/out/arch/arm64/boot/Image-dtb AnyKernel3/
          elif [ -f "kernel/out/arch/arm64/boot/Image" ]; then
            cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          fi
          if [ -f "kernel/out/arch/arm64/boot/dtb" ]; then
            cp kernel/out/arch/arm64/boot/dtb AnyKernel3/
          fi
          cd AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=beyond2lte/' anykernel.sh
          zip -r9 ../NetHunter-Laksanasoft-Enterprise-APatch-Rooted.zip *

      - name: 🚀 Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Laksanasoft-Enterprise-APatch-Rooted
          path: NetHunter-Laksanasoft-Enterprise-APatch-Rooted.zip
