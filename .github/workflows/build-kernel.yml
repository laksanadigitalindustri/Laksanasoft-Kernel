name: Build NetHunter Kernel S10+ Global

on:
  workflow_dispatch: # Menjalankan manual dari tab Actions

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Pasang Dependensi Sistem
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 libncurses-dev libtinfo-dev

    - name: Clone NetHunter Kernel Source
      run: |
        git clone --recurse-submodules https://github.com/V0lk3n/nethunter_kernel_samsung_exynos9820.git -b nethunter-lineage-23.2 kernel-src

    - name: Konfigurasi Spesifik S10+ Global (beyond2lte)
      run: |
        cd kernel-src/kali-nethunter-kernel-builder
        
        # 1. Membuat file local.config khusus untuk target S10+ Beyond2lte
        echo "ARCH=arm64" > local.config
        echo "SUBARCH=arm64" >> local.config
        
        # 2. Mengarahkan DEVICE ke codename S10+ dan defconfig nethunter yang sesuai
        echo "DEVICE=beyond2lte" >> local.config
        echo "DEFCONFIG=nethunter_beyond2lte_defconfig" >> local.config

    - name: Jalankan Build Kernel
      run: |
        cd kernel-src/kali-nethunter-kernel-builder
        chmod +x build.sh
        # Eksekusi otomatis tanpa dialog interaktif menu perangkat
        ./build.sh --non-interactive

    - name: Unggah Hasil Build (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-S10Plus-Global
        path: |
          kernel-src/kali-nethunter-kernel-builder/out/*
          kernel-src/kali-nethunter-kernel-builder/*.zip
          kernel-src/kali-nethunter-kernel-builder/*.img
