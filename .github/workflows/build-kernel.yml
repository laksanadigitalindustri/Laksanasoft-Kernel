name: Build NetHunter Kernel S10+ Global (Stabil)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Pasang Dependensi Sistem
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 libncurses-dev libtinfo-dev libssl-dev

    - name: Clone NetHunter Kernel Source
      run: |
        git clone --recurse-submodules https://github.com -b nethunter-lineage-23.2 kernel-src

    - name: Unduh Toolchain Compiler Secara Manual (Anti-Gagal)
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchains
        cd $GITHUB_WORKSPACE/toolchains
        # Mengunduh Google GCC Arm64 Toolchain resmi untuk Android Kernel
        git clone https://googlesource.com -b ndk-release-r21 --depth=1 gcc64
        # Mengunduh Google GCC Arm32 Toolchain (diperlukan untuk beberapa driver biner Exynos)
        git clone https://googlesource.com -b ndk-release-r21 --depth=1 gcc32

    - name: Konfigurasi Environment & Defconfig
      run: |
        cd kernel-src
        
        # Mengatur variabel lingkungan untuk Cross-Compilation
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-
        
        # Membuat defconfig khusus S10+ NetHunter (beyond2lte)
        make -C . ARCH=arm64 nethunter_beyond2lte_defconfig

    - name: Kompilasi Kernel Otomatis
      run: |
        cd kernel-src
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-
        
        # Memulai kompilasi menggunakan seluruh core CPU yang tersedia di server GitHub (-j$(nproc))
        make -j$(nproc) ARCH=arm64

    - name: Paketkan Hasil Jadi AnyKernel3 (Zip Flashable)
      run: |
        cd kernel-src/kali-nethunter-kernel-builder
        
        # Membuat struktur folder output zip secara mandiri
        mkdir -p output_zip
        cp ../arch/arm64/boot/Image.gz-dtb output_zip/ 2>/dev/null || cp ../arch/arm64/boot/Image output_zip/
        
        # Mengambil base AnyKernel3 untuk pembungkusan zip flashable TWRP/Recovery
        git clone https://github.com
        cp output_zip/* AnyKernel3/
        
        # Sesuaikan manifes AnyKernel3 untuk S10+ Global
        sed -i 's/device.name1=/device.name1=beyond2lte/g' AnyKernel3/anykernel.sh
        sed -i 's/device.name2=/device.name2=G975F/g' AnyKernel3/anykernel.sh
        
        # Kompres menjadi berkas ZIP siap flash
        cd AnyKernel3
        zip -r3 ../../NetHunter-Kernel-S10Plus-Global.zip *

    - name: Unggah Hasil Kernel Siap Flash
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-S10Plus-Flashable
        path: kernel-src/*.zip
