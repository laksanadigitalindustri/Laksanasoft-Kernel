name: Build NetHunter + Docker Kernel (beyond2lte)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Custom Kernel with DTB
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git gnupg gperf liblz4-tool libncurses5-dev libssl-dev lzop rsync zip python3 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: 📥 Clone Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: 📥 Clone NetHunter Kernel Source (Exynos9820)
        run: |
          git clone --depth=1 https://github.com/v0lk3n/nethunter_kernel_samsung_exynos9820.git kernel || git clone --depth=1 https://github.com/Linux4/android_kernel_samsung_exynos9820.git kernel

      - name: ⚙️ Configure Kernel (NetHunter & Docker)
        run: |
          cd kernel
          export ARCH=arm64
          export CLANG_PATH="$(pwd)/../clang/bin"
          
          # Custom Identitas Kernel
          export KBUILD_BUILD_USER="Laksanasoft"
          export KBUILD_BUILD_HOST="PT-Laksana-Digital-Industri"
          
          DEFCONFIG=$(ls arch/arm64/configs/ | grep beyond2lte | head -n 1)
          if [ -z "$DEFCONFIG" ]; then DEFCONFIG="exynos9820-beyond2lte_defconfig"; fi
          make O=out ARCH=arm64 CC=$CLANG_PATH/clang CROSS_COMPILE=$CLANG_PATH/aarch64-linux-gnu- CROSS_COMPILE_ARM32=$CLANG_PATH/arm-linux-gnueabi- $DEFCONFIG
          
          echo "[*] Menyuntikkan identitas perusahaan..."
          ./scripts/config --file out/.config --set-str LOCALVERSION "-Laksanasoft-Enterprise"
          
          echo "[*] Menyuntikkan fitur Docker dan NetHunter ke konfigurasi..."
          ./scripts/config --file out/.config -e CGROUPS -e NAMESPACES -e OVERLAY_FS -e VETH -e BRIDGE -e IP_NF_NAT -e NETFILTER_XT_MATCH_ADDRTYPE
          ./scripts/config --file out/.config -e MAC80211 -e CFG80211 -e USB_CONFIGFS_F_HID -e BT_HCIUART
          
          make O=out ARCH=arm64 CC=$CLANG_PATH/clang CROSS_COMPILE=$CLANG_PATH/aarch64-linux-gnu- CROSS_COMPILE_ARM32=$CLANG_PATH/arm-linux-gnueabi- olddefconfig

      - name: 🔨 Compile Kernel & DTB
        run: |
          cd kernel
          export CLANG_PATH="$(pwd)/../clang/bin"
          export KBUILD_BUILD_USER="Laksanasoft"
          export KBUILD_BUILD_HOST="PT-Laksana-Digital-Industri"
          make -j$(nproc --all) O=out ARCH=arm64 CC=$CLANG_PATH/clang CROSS_COMPILE=$CLANG_PATH/aarch64-linux-gnu- CROSS_COMPILE_ARM32=$CLANG_PATH/arm-linux-gnueabi- KCFLAGS="-Wno-error" Image.gz dtbs || make -j$(nproc --all) O=out ARCH=arm64 CC=$CLANG_PATH/clang CROSS_COMPILE=$CLANG_PATH/aarch64-linux-gnu- CROSS_COMPILE_ARM32=$CLANG_PATH/arm-linux-gnueabi- KCFLAGS="-Wno-error" Image
          
          if [ -d "out/arch/arm64/boot/dts/exynos" ]; then
            cat out/arch/arm64/boot/dts/exynos/*.dtb > out/arch/arm64/boot/dtb || true
          fi
          if [ -f "out/arch/arm64/boot/Image.gz" ] && [ -f "out/arch/arm64/boot/dtb" ]; then
            cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dtb > out/arch/arm64/boot/Image.gz-dtb
          fi

      - name: 📦 Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          if [ -f "kernel/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f "kernel/out/arch/arm64/boot/Image.gz" ]; then
            cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          fi
          if [ -f "kernel/out/arch/arm64/boot/dtb" ]; then
            cp kernel/out/arch/arm64/boot/dtb AnyKernel3/
          fi
          cd AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=beyond2lte/' anykernel.sh
          zip -r9 ../Laksanasoft-NetHunter-Kernel-DTB-beyond2lte.zip *

      - name: 🚀 Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Laksanasoft-NetHunter-Kernel-DTB-beyond2lte
          path: Laksanasoft-NetHunter-Kernel-DTB-beyond2lte.zip
