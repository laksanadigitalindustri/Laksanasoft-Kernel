name: Build NetHunter Kernel S10+

on:
  workflow_dispatch: # Menjalankan manual dari tab Actions

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Pasang Dependensi Sistem
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 libncurses5

    - name: Clone NetHunter Kernel Source
      run: |
        git clone --recurse-submodules https://github.com -b nethunter-lineage-23.2 kernel-src

    - name: Siapkan Konfigurasi & Jalankan Build
      run: |
        cd kernel-src/kali-nethunter-kernel-builder
        
        # Mengantisipasi jika file local.config tidak ada, kita buat default
        if [ -f ../nh_files/local.config ]; then
          cp ../nh_files/local.config .
        else
          echo "Membuat local.config otomatis..."
          echo "ARCH=arm64" > local.config
          echo "SUBARCH=arm64" >> local.config
        fi
        
        # Bypass interaktivitas skrip (pilih opsi otomatis)
        chmod +x build.sh
        echo "1" | ./build.sh || ./build.sh --non-interactive || true

    - name: Unggah Hasil Build (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-S10-Plus
        path: |
          kernel-src/kali-nethunter-kernel-builder/out/*
          kernel-src/kali-nethunter-kernel-builder/*.zip
          kernel-src/kali-nethunter-kernel-builder/*.img
          kernel-src/out/*
