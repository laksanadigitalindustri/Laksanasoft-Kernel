name: Build NetHunter Kernel S10+

on:
  workflow_dispatch: # Memungkinkan Anda menjalankan build secara manual dari web GitHub

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Pasang Dependensi Sistem
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

    - name: Clone NetHunter Kernel Source
      run: |
        git clone --recurse-submodules https://github.com -b nethunter-lineage-23.2 kernel-src

    - name: Siapkan Konfigurasi & Jalankan Build
      run: |
        cd kernel-src/kali-nethunter-kernel-builder
        cp ../nh_files/local.config .
        # Jalankan skrip build secara non-interaktif
        chmod +x build.sh
        ./build.sh --non-interactive

    - name: Unggah Hasil Build (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-S10-Plus
        path: |
          kernel-src/kali-nethunter-kernel-builder/out/*
          kernel-src/kali-nethunter-kernel-builder/*.zip
          kernel-src/kali-nethunter-kernel-builder/*.img
