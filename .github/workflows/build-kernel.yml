# ==============================================================================
# WORKFLOW: Build & Compile Kali NetHunter Kernel (LineageOS 23.2)
# PERANGKAT: Samsung Galaxy S10+ (Exynos 9820 / beyond2lte)
# DESKRIPSI: Workflow ini disesuaikan untuk kernel Android modern (LLVM/Clang)
# yang menjadi basis LineageOS 23.2. Semua baris telah diberi keterangan detail.
# KEAMANAN: Menggunakan LLVM=1 dan LLVM_IAS=1 untuk keamanan kompilasi modern.
# ==============================================================================

# Menentukan nama workflow yang akan dieksekusi oleh GitHub Actions
name: Build S10+ Kernel LOS 23.2

# Menentukan pemicu jalannya workflow ini
on:
  # Mengizinkan eksekusi secara manual dari antarmuka GitHub
  workflow_dispatch:

# Mengonfigurasi hak akses token untuk membuat rilis
permissions:
  # Memberikan hak tulis pada repositori untuk mengunggah artefak rilis
  contents: write

# Mendefinisikan pekerjaan (jobs) yang ada di dalam workflow
jobs:
  # Membuat pekerjaan bernama 'build'
  build:
    # Menjalankan pekerjaan di atas sistem operasi Ubuntu 22.04 LTS
    runs-on: ubuntu-22.04

    # Mengatur variabel lingkungan (environment variables) global
    env:
      # URL repositori kernel (WAJIB DIGANTI dengan URL kernel LOS 23.2 milik dev Anda)
      KERNEL_SOURCE: 'https://github.com/developer-name/android_kernel_samsung_exynos9820'
      # Branch repositori kernel yang dituju untuk LineageOS 23.2
      KERNEL_BRANCH: 'lineage-23.2'
      # Nama file defconfig untuk S10+ pada kernel tree tersebut
      DEFCONFIG: 'exynos9820-beyond2lte_defconfig'
      # URL repositori AnyKernel3 untuk membungkus kernel menjadi ZIP
      ANYKERNEL_REPO: 'https://github.com/osm0sis/AnyKernel3'
      # Branch dari AnyKernel3 yang digunakan
      ANYKERNEL_BRANCH: 'master'
      # Menentukan arsitektur CPU target yaitu ARM 64-bit
      ARCH: 'arm64'
      # Menentukan sub-arsitektur CPU target
      SUBARCH: 'arm64'

    # Mendefinisikan langkah-langkah (steps) eksekusi
    steps:
      # Langkah untuk mengunduh kode dari repositori workflow ini
      - name: Checkout Repositori
        # Memanggil modul checkout versi 4 dari GitHub
        uses: actions/checkout@v4

      # Langkah untuk menginstal paket dependensi sistem
      - name: Instal Dependensi Kompilasi
        # Mengeksekusi perintah shell multiline
        run: |
          # Memperbarui daftar paket repositori Ubuntu
          sudo apt-get update
          # Menginstal utilitas kompilasi esensial tanpa paket rekomendasi tambahan agar ringan dan aman
          sudo apt-get install -y --no-install-recommends build-essential bc bison flex libssl-dev libelf-dev libncurses-dev git zip unzip curl wget lzop python3 libxml2-utils ccache

      # Langkah untuk mengunduh compiler Clang (LLVM)
      - name: Unduh Toolchain Clang
        # Mengeksekusi perintah shell multiline
        run: |
          # Membuat direktori bernama 'toolchain' di dalam ruang kerja GitHub
          mkdir -p $GITHUB_WORKSPACE/toolchain
          # Memindahkan direktori aktif ke dalam folder 'toolchain'
          cd $GITHUB_WORKSPACE/toolchain
          # Mengkloning Proton Clang versi terbaru dengan riwayat dangkal (depth=1) untuk kecepatan
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      # Langkah untuk mengunduh source code kernel
      - name: Unduh Source Code Kernel
        # Mengeksekusi perintah shell multiline
        run: |
          # Kembali ke direktori ruang kerja utama
          cd $GITHUB_WORKSPACE
          # Mengkloning source kernel secara dangkal dari branch LOS 23.2 ke folder 'kernel-source'
          git clone --depth=1 -b $KERNEL_BRANCH $KERNEL_SOURCE kernel-source

      # Langkah untuk mengunduh dan menyiapkan AnyKernel3
      - name: Siapkan AnyKernel3
        # Mengeksekusi perintah shell multiline
        run: |
          # Memastikan berada di ruang kerja utama
          cd $GITHUB_WORKSPACE
          # Mengkloning repositori AnyKernel3 ke dalam folder 'AnyKernel3'
          git clone --depth=1 -b $ANYKERNEL_BRANCH $ANYKERNEL_REPO AnyKernel3
          # Menghapus folder '.git' pada AnyKernel3 agar tidak konflik saat pengemasan ZIP
          rm -rf AnyKernel3/.git

      # Langkah krusial: Memulai proses kompilasi kernel
      - name: Kompilasi Kernel (LLVM)
        # Mengeksekusi perintah shell multiline
        run: |
          # Memasuki folder source code kernel
          cd $GITHUB_WORKSPACE/kernel-source
          # Memasukkan folder binary Clang ke dalam variabel PATH sistem agar bisa dipanggil langsung
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          # Membersihkan file sisa kompilasi lama untuk mencegah bug konfigurasi silang
          make O=out clean mrproper
          # Membangun file '.config' awal berdasarkan defconfig S10+
          make O=out ARCH=$ARCH CC=clang $DEFCONFIG
          # Memulai kompilasi paralel dengan memanfaatkan semua inti prosesor yang tersedia
          make -j$(nproc --all) O=out ARCH=$ARCH SUBARCH=$SUBARCH CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1

      # Langkah untuk mengemas hasil kompilasi ke dalam ZIP flashable
      - name: Kemas Kernel ke ZIP
        # Mengeksekusi perintah shell multiline
        run: |
          # Mendefinisikan lokasi file output 'Image' hasil kompilasi
          IMAGE_PATH="$GITHUB_WORKSPACE/kernel-source/out/arch/arm64/boot/Image"
          # Melakukan validasi keamanan: mengecek apakah file 'Image' benar-benar tercipta
          if [ ! -f "$IMAGE_PATH" ]; then
            # Menampilkan pesan error jika file tidak ada
            echo "Error: Kompilasi gagal, Image tidak ditemukan"
            # Menghentikan skrip dengan kode keluar 1 (error)
            exit 1
          # Menutup blok kondisi if
          fi
          # Menyalin file 'Image' ke dalam folder AnyKernel3
          cp $IMAGE_PATH $GITHUB_WORKSPACE/AnyKernel3/Image
          # Berpindah ke folder AnyKernel3
          cd $GITHUB_WORKSPACE/AnyKernel3
          # Membuat format nama file ZIP yang menyertakan tanggal dan waktu
          ZIP_NAME="NetHunter-LOS23.2-S10Plus-$(date +'%Y%m%d-%H%M').zip"
          # Mengompresi seluruh isi folder AnyKernel3 menjadi file ZIP dengan level kompresi maksimum (9)
          zip -r9 "$ZIP_NAME" * -x .git README.md *placeholder
          # Menyimpan variabel nama ZIP ke dalam sistem environment GitHub Actions
          echo "FINAL_ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          # Menyimpan variabel lokasi ZIP absolut ke dalam sistem environment GitHub Actions
          echo "FINAL_ZIP_PATH=$GITHUB_WORKSPACE/AnyKernel3/$ZIP_NAME" >> $GITHUB_ENV

      # Langkah untuk mengunggah artefak (file ZIP) ke GitHub
      - name: Unggah Artefak Build
        # Menggunakan modul upload-artifact versi 4
        uses: actions/upload-artifact@v4
        # Mendefinisikan argumen untuk modul unggah
        with:
          # Memberikan nama artefak sesuai variabel yang dibuat di langkah sebelumnya
          name: ${{ env.FINAL_ZIP_NAME }}
          # Menentukan lokasi file yang akan diunggah sesuai variabel lokasi absolut
          path: ${{ env.FINAL_ZIP_PATH }}
