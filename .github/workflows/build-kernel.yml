name: Build NetHunter Kernel S10+ Global Fixed

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Pasang Dependensi Sistem
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 libncurses-dev libtinfo-dev libssl-dev

    - name: Clone NetHunter Kernel Source (Link Diperbaiki)
      run: |
        # Menggunakan tautan utuh yang benar ke repositori V0lk3n
        git clone --recurse-submodules https://github.com/V0lk3n/nethunter_kernel_samsung_exynos9820.git -b nethunter-lineage-23.2 kernel-src

    - name: Siapkan Konfigurasi S10+ (beyond2lte)
      run: |
        cd kernel-src/kali-nethunter-kernel-builder
        
        # Menggunakan local.config asli dari repositori V0lk3n
        cp ../nh_files/local.config .
        
        # Memastikan target perangkat mengarah ke S10+ versi Global (beyond2lte)
        sed -i 's/DEVICE=.*/DEVICE=beyond2lte/g' local.config
        sed -i 's/DEFCONFIG=.*/DEFCONFIG=nethunter_beyond2lte_defconfig/g' local.config

    - name: Jalankan Build Kernel Otomatis
      run: |
        cd kernel-src/kali-nethunter-kernel-builder
        chmod +x build.sh
        
        # Mengirimkan opsi otomatis secara berurutan:
        # 'S' untuk mengunduh dan menyiapkan toolchain compiler bawaan
        # 'N' untuk memulai kompilasi NetHunter penuh dan membungkus hasil ZIP
        # 'E' untuk menutup menu setelah selesai
        printf "S\nN\nE\n" | ./build.sh

    - name: Unggah Hasil Kernel Jadi
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-S10Plus-Global
        path: |
          kernel-src/kali-nethunter-kernel-builder/out/*
          kernel-src/kali-nethunter-kernel-builder/*.zip
